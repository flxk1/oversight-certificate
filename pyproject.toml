[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oversight-certificate"
version = "0.1.0"
description = "A re-checkable certificate that a qualified human exercised meaningful oversight — refuse-to-decide first-class, verifiable offline."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "flxk1" }]
dependencies = []

[project.optional-dependencies]
recommended = ["cryptography>=42.0", "rfc8785>=0.1.2"]
test = ["pytest>=7", "cryptography>=42.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oversight_certificate = ["py.typed"]
